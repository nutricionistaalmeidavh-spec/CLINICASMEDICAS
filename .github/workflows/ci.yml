name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit report
        run: npm audit --json || true

      - name: Syntax validation
        run: npm run lint

      - name: Automated tests
        run: npm test
